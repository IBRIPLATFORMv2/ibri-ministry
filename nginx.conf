server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Daily.co CSP Header
    add_header Content-Security-Policy "default-src 'self' https://*.daily.co wss://*.daily.co; script-src 'self' 'unsafe-inline' https://*.daily.co; frame-src 'self' https://*.daily.co; connect-src 'self' https://*.daily.co wss://*.daily.co; img-src 'self' data: https://*.daily.co; media-src 'self' blob: https://*.daily.co;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
